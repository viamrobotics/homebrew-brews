name: brew bottle

on:
  workflow_call:
    inputs:
      formula:
        type: string
        default: viam
        description: which formula to bottle
      ref:
        type: string
        default: ''
        description: branch holding the version bump to bottle; blank means the triggering ref
    secrets:
      GIT_ACCESS_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      formula:
        type: string
        default: viam
        description: which formula to bottle
      ref:
        type: string
        required: false
        description: branch holding the version bump to bottle; blank means the triggering ref

env:
  # if you don't override root-url it will upload to / download from the wrong place
  ROOT_URL: https://ghcr.io/v2/${{ github.repository }}
  # keep brew at the version checked out by the "pin homebrew" step
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  bottle:
    strategy:
      fail-fast: false
      matrix:
        runs-on: [ubuntu-22.04, macos-15, macos-26]
    runs-on: ${{ matrix.runs-on }}
    steps:
      # Homebrew/actions/setup-homebrew@2026.09.13.1
      - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9
        with:
          stable: true
      - name: pin homebrew
        run: |
          # setup-homebrew leaves brew on its newest tag; a fixed tag keeps bottling deterministic across releases
          git -C "$(brew --repository)" fetch --quiet --force --tags origin
          git -C "$(brew --repository)" checkout --quiet 7.0.1
          brew --version
      # setup-homebrew symlinks the tap to this checkout, so brew builds whatever ref lands here
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - name: pull
        run: |
          # see note below on why we need to pull
          git pull

      - name: build bottle
        env:
          FORMULA: ${{ inputs.formula }}
        run: |
          # pkgconf conflicts with files github preinstalls on runners. openssl@4 must link before the deps step: linking it
          # there unlinks openssl@3, whose lock that step already holds, and brew fails (Homebrew/brew#24204)
          brew install --force --overwrite pkg-config openssl@4

          # trust before tap: Homebrew 7+ refuses to tap an untrusted third-party tap
          brew trust viamrobotics/brews
          brew tap viamrobotics/brews
          # note: this fails on the nlopt dep to viam-server when viam-server already exists as bottle in the formula file.
          # weird edge case. recovery is to remove the bottle stanza and delete the uploaded package, then rerun.
          brew install --only-dependencies "$FORMULA"
          # retries ride out transient fetch errors (e.g. Go module proxy resets); brew removes a failed build's keg
          for attempt in 1 2 3; do
            brew install --build-bottle "$FORMULA" && break
            [ "$attempt" -lt 3 ] || exit 1
            sleep $((attempt * 30))
          done
          brew bottle --json --root-url "$ROOT_URL" "$FORMULA"
      
      - name: Generate UUID
        id: uuid_step
        run: echo "::set-output name=uuid::$(uuidgen)"
  
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.formula }}--${{ matrix.runs-on }}-${{ steps.uuid_step.outputs.uuid }}
          if-no-files-found: error
          path: '*.bottle.*'
