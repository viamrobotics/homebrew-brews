name: brew bottle

on:
  workflow_call:
    inputs:
      formula:
        type: string
        default: viam
        description: which formula to bottle
      ref:
        type: string
        default: ''
        description: tap ref to bottle from; blank means the tap's default branch
    secrets:
      GIT_ACCESS_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      formula:
        type: string
        default: viam
        description: which formula to bottle
      ref:
        type: string
        required: false
        description: tap ref to bottle from; blank means the tap's default branch

env:
  # if you don't override root-url it will upload to / download from the wrong place
  ROOT_URL: https://ghcr.io/v2/${{ github.repository }}
  # keep brew at the version checked out by the "pin homebrew" step
  HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
  bottle:
    strategy:
      matrix:
        runs-on: [ubuntu-22.04, macos-14, macos-15]
    runs-on: ${{ matrix.runs-on }}
    steps:
      # Homebrew/actions/setup-homebrew@2026.09.13.1
      - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9
        with:
          stable: true
      - name: pin homebrew
        run: |
          # setup-homebrew leaves brew on its newest tag; a fixed tag keeps bottling deterministic across releases
          git -C "$(brew --repository)" fetch --quiet --force --tags origin
          git -C "$(brew --repository)" checkout --quiet 7.0.1
          brew --version
      - uses: actions/checkout@v4
      - name: pull
        run: |
          # see note below on why we need to pull
          git pull

      - name: build bottle
        env:
          REF: ${{ inputs.ref }}
        run: |
          # without this force-install, the pkgconf dep of viam-server conflicts with the one github preinstalls on runners, and the build fails
          brew install --force --overwrite pkg-config

          # trust before tap: Homebrew 7+ refuses to tap an untrusted third-party tap
          brew trust viamrobotics/brews
          brew tap viamrobotics/brews

          # brew tap clones the tap's default branch, so a version bump that has not been
          # merged yet is only visible once the tap checkout is moved onto its ref.
          if [ -n "$REF" ]; then
            TAP_DIR=$(brew --repository viamrobotics/brews)
            git -C "$TAP_DIR" fetch --quiet origin "$REF"
            git -C "$TAP_DIR" checkout --quiet -B bottling FETCH_HEAD
            git -C "$TAP_DIR" log --oneline -1
          fi

          # note: this fails on the nlopt dep to viam-server when viam-server already exists as bottle in the formula file.
          # weird edge case. recovery is to remove the bottle stanza and delete the uploaded package, then rerun.
          brew install --only-dependencies ${{ inputs.formula }}
          brew install --build-bottle ${{ inputs.formula }}
          brew bottle --json --root-url $ROOT_URL ${{ inputs.formula }}
      
      - name: Generate UUID
        id: uuid_step
        run: echo "::set-output name=uuid::$(uuidgen)"
  
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.runs-on }}-${{ steps.uuid_step.outputs.uuid }}
          if-no-files-found: error
          path: '*.bottle.*'
