name: brew upload

on:
    workflow_call:
        inputs:
            run_id:
                type: string
                default: ''
                description: run holding the bottle artifacts; blank means this run
            formula:
                type: string
                default: ''
                description: formula whose bottles to upload; blank means every bottle in the run
            ref:
                type: string
                default: ''
                description: staging branch to land on main with the bottle, then delete; blank pushes the checkout in place
        secrets:
            GIT_ACCESS_TOKEN:
                required: true
    workflow_dispatch:
        inputs:
            run_id:
                type: string
                required: false
                description: run holding the bottle artifacts; blank means this run
            formula:
                type: string
                required: false
                description: formula whose bottles to upload; blank means every bottle in the run
            ref:
                type: string
                required: false
                description: staging branch to land on main with the bottle, then delete; blank pushes the checkout in place

env:
    # if you don't override root-url it will upload to / download from the wrong place
    ROOT_URL: https://ghcr.io/v2/${{ github.repository }}
    # keep brew at the version checked out by the "pin homebrew" step
    HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
    upload:
        runs-on: ubuntu-latest
        permissions:
          contents: write
          packages: write
        steps:
        # Homebrew/actions/setup-homebrew@2026.09.13.1
        - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9
          with:
            stable: true
        - name: pin homebrew
          run: |
            # setup-homebrew leaves brew on its newest tag; a fixed tag keeps bottling deterministic across releases
            git -C "$(brew --repository)" fetch --quiet --force --tags origin
            git -C "$(brew --repository)" checkout --quiet 7.0.1
            brew --version
        - uses: actions/checkout@v4
          with:
            ref: ${{ inputs.ref }}
            token: ${{ secrets.GIT_ACCESS_TOKEN }}
            # the rebase onto main in "push changes" needs the merge base
            fetch-depth: 0
    
        - name: git setup
          run: |
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --global user.name "actions bot"
            git config push.autoSetupRemote true
            git branch
            # why pull: for the case where we are bottling two formulae, formula 1 will push a new commit.
            # Then formula 2's bottle job will check out the original commit, try to push, and collid with
            # formula 1's commit.
            git pull
    
        - name: download artifacts
          env:
            GH_TOKEN: ${{ github.token }}
            RUN_ID: ${{ inputs.run_id }}
            THIS_RUN_ID: ${{ github.run_id }}
            FORMULA: ${{ inputs.formula }}
          run: |
            # trust before tap: Homebrew 7+ refuses to tap an untrusted third-party tap
            brew trust viamrobotics/brews
            brew tap viamrobotics/brews
            # bottle.yml names artifacts "<formula>--<runner>-<uuid>"; the "--" keeps viam from matching viam-server
            gh run download "${RUN_ID:-$THIS_RUN_ID}" --pattern "${FORMULA:+$FORMULA--}*"
            mv */*.bottle.* .
            ls
    
        - name: upload
          env:
            HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
            HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          run: brew pr-upload --root-url $ROOT_URL
    
        - name: push changes
          env:
            REF: ${{ inputs.ref }}
          run: |
            cd $(brew --prefix)/Homebrew/Library/Taps/${{ github.repository }}
            # note: the tap is on the current branch rather than main. not sure why, seems sensitive to whether we run actions/checkout.
            git log | head
            git status
            if [ -n "$REF" ]; then
              # main can move between fetch and push; the bottles are already on ghcr, so landing must not give up early
              for attempt in 1 2 3; do
                git fetch --quiet origin main
                git rebase origin/main
                git push origin HEAD:main && break
                [ "$attempt" -lt 3 ] || exit 1
              done
              git push origin --delete "$REF"
            else
              git push
            fi