name: brew upload

on:
    workflow_call:
        inputs:
            run_id:
                type: string
                default: ''
                description: run holding the bottle artifacts; blank means this run
            ref:
                type: string
                default: ''
                description: staging branch to publish and fast-forward main to; blank pushes in place
        secrets:
            GIT_ACCESS_TOKEN:
                required: true
    workflow_dispatch:
        inputs:
            run_id:
                type: string
                required: false
                description: run holding the bottle artifacts; blank means this run
            ref:
                type: string
                required: false
                description: staging branch to publish and fast-forward main to; blank pushes in place

env:
    # if you don't override root-url it will upload to / download from the wrong place
    ROOT_URL: https://ghcr.io/v2/${{ github.repository }}
    # keep brew at the version checked out by the "pin homebrew" step
    HOMEBREW_NO_AUTO_UPDATE: '1'

jobs:
    upload:
        runs-on: ubuntu-latest
        permissions:
          contents: write
          packages: write
        steps:
        # Homebrew/actions/setup-homebrew@2026.09.13.1
        - uses: Homebrew/actions/setup-homebrew@1e34f2e2acaa766b7efacb8c26352e6abbb023f9
          with:
            stable: true
        - name: pin homebrew
          run: |
            # setup-homebrew leaves brew on its newest tag; a fixed tag keeps bottling deterministic across releases
            git -C "$(brew --repository)" fetch --quiet --force --tags origin
            git -C "$(brew --repository)" checkout --quiet 7.0.1
            brew --version
        - uses: actions/checkout@v4
          with:
            token: ${{ secrets.GIT_ACCESS_TOKEN }}
    
        - name: git setup
          run: |
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git config --global user.name "actions bot"
            git config push.autoSetupRemote true
            git branch
            # why pull: for the case where we are bottling two formulae, formula 1 will push a new commit.
            # Then formula 2's bottle job will check out the original commit, try to push, and collid with
            # formula 1's commit.
            git pull
    
        - name: download artifacts
          env:
            GH_TOKEN: ${{ github.token }}
            RUN_ID: ${{ inputs.run_id }}
            THIS_RUN_ID: ${{ github.run_id }}
            REF: ${{ inputs.ref }}
          run: |
            # trust before tap: Homebrew 7+ refuses to tap an untrusted third-party tap
            brew trust viamrobotics/brews
            brew tap viamrobotics/brews

            # pr-upload rewrites the bottle block in the tap checkout and commits it, so the
            # checkout has to sit on the staged bump for the two to end up on one branch.
            if [ -n "$REF" ]; then
              TAP_DIR=$(brew --repository viamrobotics/brews)
              git -C "$TAP_DIR" fetch --quiet origin "$REF"
              git -C "$TAP_DIR" checkout --quiet -B publishing FETCH_HEAD
            fi

            gh run download "${RUN_ID:-$THIS_RUN_ID}"
            mv */*.bottle.* .
            ls
    
        - name: upload
          env:
            HOMEBREW_GITHUB_PACKAGES_USER: ${{ github.repository_owner }}
            HOMEBREW_GITHUB_PACKAGES_TOKEN: ${{ github.token }}
          run: brew pr-upload --root-url $ROOT_URL
    
        - name: push changes
          env:
            REF: ${{ inputs.ref }}
          run: |
            cd "$(brew --repository viamrobotics/brews)"
            # note: the tap is on the current branch rather than main. not sure why, seems sensitive to whether we run actions/checkout.
            git log | head
            git status
            if [ -n "$REF" ]; then
              # Main moves only here, so a bump and the bottle matching it arrive together.
              git fetch --quiet origin main
              git rebase origin/main
              git push origin HEAD:main
              git push --delete origin "$REF" || true
            else
              git push
            fi
